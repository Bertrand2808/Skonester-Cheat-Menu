 skonester_cheat_menu.3080.opt_instant_replenish_tt: "@supply_icon! Ne modifie pas les effectifs. Capacité d’approvisionnement massive et épuisement minimal. En guerre, toutes les armées sont entièrement regarnies tous les 7 jours et chaque mois. Entretien et attrition quasi nuls. Cliquez à nouveau pour désactiver."

