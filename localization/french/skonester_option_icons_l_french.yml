 skonester_cheat_menu.3080.opt_levy_multiplier_tt: "@gold_icon! Taille des levées multipliée par 100, limite d’hommes d’armes augmentée. Les troupes non levées ne coûtent aucun or par mois. Cumule trois effets d’entretien nul, réinitialisés chaque mois. Cliquez à nouveau pour désactiver."

