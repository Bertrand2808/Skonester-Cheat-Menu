 skonester_cheat_menu.3080.opt_god_mode: "@advantage_icon! Mode dieu des armées"

 skonester_cheat_menu.3080.opt_god_mode_tt: "@advantage_icon! Pertes quasi nulles et avantage écrasant au combat. Vitesse de marche maximale; aucune pénalité due à l’hiver, aux raids, à l’embarquement ou aux traversées de rivières. Cliquez à nouveau pour désactiver."

