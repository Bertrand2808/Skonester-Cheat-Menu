 skonester_treasure_maker.0001.t: "Atelier d’artefacts"

 skonester_treasure_maker.0001.desc: "Réglez les niveaux de 25 attributs et d’ensembles de modificateurs puissants. Choisissez la forme et la qualité de l’artefact, puis fabriquez-le. Si « Octroyer à la cible » est activé, l’artefact sera donné au personnage sur lequel vous avez fait un clic droit.\nCK3 ne gère pas les curseurs: ce menu utilise donc une navigation par événements. Les noms et descriptions des artefacts reposent sur des entrées de localisation fixes."

