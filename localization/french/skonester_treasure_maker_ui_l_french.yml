 skonester_treasure_maker.2000.toggle_knights: "Activer: bonus des chevaliers et des renforts"



 skonester_treasure_maker.3000.t: "Type d’artefact"

 skonester_treasure_maker.3000.desc: "L’épée est sélectionnée par défaut. Les insignes royaux utilisent le modèle d’insignes standard du jeu."

