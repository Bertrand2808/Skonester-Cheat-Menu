 skonester_treasure_maker.3999.t: "Fabrication terminée"

 skonester_treasure_maker.3999.desc: "Votre artefact a été fabriqué selon vos choix. Le propriétaire est déterminé par la règle de destinataire sélectionnée. Tous les réglages de l’atelier ont été réinitialisés, prêts pour une nouvelle fabrication."



 skonester_treasure_maker_workshop: "Atelier d’artefacts"

 skonester_treasure_maker_workshop_desc: "Ouvrez l’atelier d’artefacts. Réglez 25 niveaux d’attributs, activez des ensembles de modificateurs puissants, choisissez le type et la qualité, puis fabriquez des artefacts dans le style de Royal Court."



 skonester_tm_artifact_name: "Forge prodigieuse"

 skonester_tm_artifact_desc: "Forgé dans l’atelier d’artefacts. Ses bénédictions portent la puissance mortelle à des sommets extraordinaires."

