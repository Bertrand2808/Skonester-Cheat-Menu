 skonester_treasure_maker.3001.t: "Niveau de qualité"

 skonester_treasure_maker.3001.desc: "Valeur de qualité par défaut: 85/85. Faible: 20/20, moyenne: 50/50, élevée: 95/95."

 skonester_treasure_maker.3001.q_low: "Faible (20)"

 skonester_treasure_maker.3001.q_mid: "Moyenne (50)"

 skonester_treasure_maker.3001.q_high: "Élevée (95)"

