l_french:
  trait_nnn_challenger:0 "Beaucoup d’enfants, beaucoup de bénédictions"
  trait_nnn_challenger_desc:0 "Barbara l’Ointe enseigne que la fortune afflue par une nombreuse descendance, chaque enfant étant une bénédiction vivante."
  trait_nnn_challenger_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] suit la sagesse de Barbara l’Ointe et trouve force et prospérité dans ses nombreux enfants."

  trait_build_speed_cheat:0 "Réincarnation de Villard de Honnecourt"
  trait_build_speed_cheat_desc:0 "Seule Barbara l’Ointe pouvait bénir un mortel de la rapidité et de la vision de Villard de Honnecourt."
  trait_build_speed_cheat_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] élève châteaux et cathédrales comme guidé par la main de Villard et béni par Barbara l’Ointe."

  trait_stress_gain_remove:0 "Béni et insouciant"
  trait_stress_gain_remove_desc:0 "Protégé par Barbara l’Ointe, ce personnage avance sans crainte ni souci."
  trait_stress_gain_remove_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] repose dans la grâce de Barbara l’Ointe, libéré à jamais des fardeaux de ce monde."

  trait_tyranny_gain_remove:0 "Équipe d’avocats de premier ordre"
  trait_tyranny_gain_remove_desc:0 "Barbara l’Ointe protège ce personnage par des avocats invisibles qui le défendent contre toute accusation."
  trait_tyranny_gain_remove_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] est au-dessus de tout reproche, car Barbara l’Ointe confère une autorité divine à chacun de ses actes."

  trait_100_stat_man:0 "Omnipotent"
  trait_100_stat_man_desc:0 "Une légende exaltée par Barbara l’Ointe, un génie oint par la grâce divine. Nul ne peut triompher de cette âme destinée."
  trait_100_stat_man_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] avance en élu de Barbara l’Ointe, légende parmi les légendes et porteur d’une puissance irrésistible."

  immortal:0 "Immortel"
