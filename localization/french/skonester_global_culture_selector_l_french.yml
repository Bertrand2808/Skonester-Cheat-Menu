 skonester_cheat_menu.1360.t: "Choisir une culture (région → patrimoine → culture)"
 skonester_cheat_menu.1360.desc: "Sélectionnez une région, puis un groupe de patrimoine, puis une culture. Vous pouvez aussi consulter la liste alphabétique complète des patrimoines ou l’index complet des cultures."
