l_french:
 #Skonester Edition
 pcm_money_decision_title:0 "#Skonester :#! Trésor du royaume"
 pcm_money_decision_desc:0 "Faites surgir un immense trésor et recevez une manne d’or, de piété et de renommée."
 pcm_money_decision_tooltip:0 "Obtenez une grande réserve d’or, de piété et de prestige pour commencer votre règne avec force."
 pcm_money_decision_ct:0 "Les coffres des rois débordent devant moi !"

 pcm_subrealm_to_culture_decision_title:0 "#Skonester :#! Édit de culture"
 pcm_subrealm_to_culture_decision_desc:0 "Proclamez un édit ordonnant à tous les vassaux et terres d’adopter la culture de leur seigneur lige."
 pcm_subrealm_to_culture_decision_tooltip:0 "Unissez votre royaume sous une seule culture."
 pcm_subrealm_to_culture_decision_ct:0 "Désormais, le royaume parlera d’une seule langue et suivra une seule coutume."

 pcm_convert_subrealm_to_religion_decision_title:0 "#Skonester :#! Édit de foi"
 pcm_convert_subrealm_to_religion_decision_desc:0 "Proclamez un édit ordonnant que vos vassaux et votre sous-royaume soient convertis à votre foi."
 pcm_convert_subrealm_to_religion_decision_tooltip:0 "Unissez votre royaume sous une seule bannière sainte."
 pcm_convert_subrealm_to_religion_decision_ct:0 "Que la lumière de la vérité tombe sur les égarés !"

 pcm_show_decision_title:0 "--= #Skonester :#! Révéler les édits cachés =--"
 pcm_show_decision_desc:0 "Révélez tous les décrets Skonester."
 pcm_show_decision_tooltip:0 ""
 pcm_show_decision_ct:0 "Qu’il en soit écrit ainsi, qu’il en soit su ainsi."

 pcm_hide_decision_title:0 "--= #Skonester :#! Dissimuler les édits =--"
 pcm_hide_decision_desc:0 "Dissimulez les décrets Skonester à la vue."
 pcm_hide_decision_tooltip:0 ""
 pcm_hide_decision_ct:0 "Scellez les parchemins et faites taire les langues."

 pcm_cure_pox_decision_title:0 "#Skonester :#! Purge des afflictions"
 pcm_cure_pox_decision_desc:0 "Par décret, tous les maux charnels et les maladies courantes seront bannis du royaume."
 pcm_cure_pox_decision_tooltip:0 "Purifiez le royaume des afflictions de la chair."
 pcm_cure_pox_decision_ct:0 "Les herbes du guérisseur et les huiles saintes me rendent à la pureté !"

 pcm_cure_all_decision_title:0 "#Skonester :#! Panacée du royaume"
 pcm_cure_all_decision_desc:0 "Un élixir merveilleux est proclamé, guérissant toutes sortes de maladies à travers le pays."
 pcm_cure_all_decision_tooltip:0 "Guérissez tous les maux et fléaux du royaume."
 pcm_cure_all_decision_ct:0 "Réjouissez-vous ! L’ombre de la maladie quitte notre peuple."

 pcm_cure_inbred_decision_title:0 "#Skonester :#! Purification des lignées"
 pcm_cure_inbred_decision_desc:0 "Par des rites mystiques et la faveur divine, les souillures de votre royaume sont purifiées."
 pcm_cure_inbred_decision_tooltip:0 "Retirez toutes les mauvaises humeurs et tares du royaume."
 pcm_cure_inbred_decision_ct:0 "Le sang de mes terres coule de nouveau pur et fort !"
 
