 toc_stabilizeland_modifier_desc:0 "Augmente le contrôle et la stabilité de la province."
 
 toc_cityland_modifier:0 "Cité mineure"
 toc_cityland_modifier_desc:0 "Augmente les impôts et le développement locaux."
 
 toc_bigcityland_modifier:0 "Cité majeure"
 toc_bigcityland_modifier_desc:0 "Augmente fortement les impôts et le développement locaux."
 
 toc_imperialcityland_modifier:0 "Capitale impériale"
 toc_imperialcityland_modifier_desc:0 "Augmente massivement les impôts, les levées et le développement."
 
 toc_hordeland_modifier:0 "Campement de horde"
 toc_hordeland_modifier_desc:0 "Augmente les levées et le taux de renforts."
 
 toc_grandwallland_modifier:0 "Défenses maximales"
 toc_grandwallland_modifier_desc:0 "Augmente massivement le niveau de fortification et la taille de la garnison."
 
 toc_allfiefs_modifier:0 "Domaine et vassaux illimités"
 toc_allfiefs_modifier_desc:0 "Supprime les pénalités de limite de domaine et de limite de vassaux."


