l_french:
 # Base Traits
 trait_sneed_seed:0 "Sang des Dúnedain"
 trait_sneed_seed_desc:0 "Ce personnage possède le noble sang des Hommes de l’Ouest, qui lui confère une longévité et une sagesse supérieures à celles de ses pairs."
 
 trait_gigasuperseed:0 "Sang de Númenor"
 trait_gigasuperseed_desc:0 "Ce personnage est un rejeton des Hauts Númenóréens et porte la lignée pure de Westernesse depuis les temps anciens."
 
 trait_greatest_lord_np:0 "Intendant du Royaume"
 trait_greatest_lord_np_desc:0 "Ce personnage détient l’autorité d’un Haut Intendant et gouverne avec le mandat des Peuples Libres."
 
 trait_greatest_lord_t:0 "Seigneur des Hautes Maisons"
 trait_greatest_lord_t_desc:0 "Ce personnage descend des Grandes Maisons des Edain et commande le respect de tous les Hommes."
 
 trait_insane_generale:0 "Capitaine de l’Ouest"
 trait_insane_generale_desc:0 "Un chef de guerre légendaire dont le génie tactique se murmure aussi bien au Gondor que dans les terres de l’Ombre."

 trait_insane_opinion_fv:0 "Terreur des Neuf"
 trait_insane_opinion_fv_desc:0 "La réputation de ce personnage est si redoutable qu’elle glace le cœur des amis comme des ennemis."
 
 trait_insane_opinion_fa:0 "Ombre de l’Invisible"
 trait_insane_opinion_fa_desc:0 "Une présence qui exige une obéissance totale par la seule force d’une terreur écrasante et d’une volonté de fer."

 trait_crazyminded_psycho:0 "Souillure de Morgoth"
 trait_crazyminded_psycho_desc:0 "L’esprit du personnage est entaché d’une obscurité ancienne, qui le pousse à des actes d’extrême cruauté et de folie."
 
 trait_goodguy_toc:0 "Grâce des Valar"
 trait_goodguy_toc_desc:0 "Ce personnage a un caractère doux et paisible, comme béni par les puissances de l’Ouest."

 trait_pantokratorus_a:0 "Haut-roi"
 trait_pantokratorus_a_desc:0 "Ce personnage est reconnu comme un grand conquérant et le haut-roi de son âge."
 
 trait_borntorule_seed:0 "Véritable héritier d’Isildur"
 trait_borntorule_seed_desc:0 "Ce personnage est reconnu comme le légitime héritier des royaumes d’antan."
 
 trait_pantokratorus_ablood:0 "Lignée des rois"
 trait_pantokratorus_ablood_desc:0 "Ce personnage possède le sang des anciens rois qui, les premiers, défièrent l’Ombre."

 # Custom Bloodlines
 trait_first_bloodline1:0 "Parent des Peuples Libres"
 trait_first_bloodline1_desc:0 "Un faible héritage des gens du commun de la Terre du Milieu, qui confère une modeste hausse de statut et de légitimité."
  
 trait_second_bloodline2:0 "Rejeton des Hautes Maisons"
 trait_second_bloodline2_desc:0 "Une lignée reconnue qui porte la force et la vitalité des maisons nobles des Hommes."
  
 trait_third_bloodline3:0 "Héritage d’Arnor"
 trait_third_bloodline3_desc:0 "Une lignée respectée dont le sang porte l’habileté et la renommée du Royaume du Nord."
  
 trait_fourth_bloodline4:0 "Héritier de Westernesse"
 trait_fourth_bloodline4_desc:0 "Un puissant héritage des Rois-marins, admiré des parents comme des vassaux pour son autorité innée."
  
 trait_fifth_bloodline5:0 "Sang d’Elendil"
 trait_fifth_bloodline5_desc:0 "Une lignée exaltée du plus haut rang, qui confère d’immenses bonus d’aptitudes, de vitalité et de renommée dynastique."

 trait_toc_patrilinealblood:0 "Lignée ancestrale des pères"
 trait_toc_patrilinealblood_desc:0 "Une lignée paternelle reconnue par le sang et l’autorité des anciennes maisons."
  
 trait_toc_patrilinealblood2:0 "Héritage paternel souverain"
 trait_toc_patrilinealblood2_desc:0 "Une lignée paternelle plus forte, porteuse du prestige et de l’autorité d’une dynastie régnante."
  
 trait_toc_patrilinealblood3:0 "Maison éternelle de l’Ouest"
 trait_toc_patrilinealblood3_desc:0 "Une lignée paternelle dominante, qui confère une vitalité durable et le droit de régner légitimement à travers les âges."

 # Special Traits
 trait_toc_gamerblood0:0 "Murmures d’Orthanc"
 trait_toc_gamerblood0_desc:0 "Ce personnage possède une lignée marquée par la ruse et la manipulation des grands comploteurs."
 
 trait_toc_gamer0:0 "Maître de la tromperie"
 trait_toc_gamer0_desc:0 "Confère d’énormes bonus d’intrigue et de réussite des complots, rivalisant avec la langue subtile de Saruman."
 
 trait_toc_immortalblood:0 "Étincelle des Ainur"
 trait_toc_immortalblood_desc:0 "Ce personnage possède la lignée des Immortels, un pont entre le monde visible et le monde invisible."
 
 trait_toc_immortal:0 "Esprit éternel"
 trait_toc_immortal_desc:0 "Ce personnage est lié aux cercles du monde et ne peut mourir ni de vieillesse ni de maladie."

