l_french:
 skonester_clavius_grail_name:0 "Graal de la sentinelle éternelle"
 skonester_clavius_grail_description:0 "La coupe confiée au tribun Clavius Aquila, dont les humbles origines se cachent sous les offrandes d’innombrables générations. Avant la fin de sa longue veille, Clavius l’a remise entre les mains de son successeur. C’est un gage de protéger les vivants avec la patience de celui que la mort ne peut plus presser."
 skonester_clavius_grail_modifier:0 "Dernière mission de Clavius"
 skonester_clavius_grail_modifier_desc:0 "La coupe du tribun appelle son gardien à la sagesse, à la dévotion et à la justice envers chaque sujet."
 skonester_clavius_handover_memory:0 "Dernière veille de Clavius"
 skonester_clavius_handover_memory_desc:0 "J’ai bu au Graal de Clavius Aquila et accepté sa mission de sentinelle éternelle. Enfin, la longue veille du tribun a pris fin."
 skonester_clavius_handover_memory_desc_second_perspective:0 "Vous avez bu au Graal de Clavius Aquila et accepté sa mission de sentinelle éternelle. Enfin, la longue veille du tribun a pris fin."
 skonester_clavius_handover_memory_desc_third_perspective:0 "Ce personnage a bu au Graal de Clavius Aquila et accepté sa mission de sentinelle éternelle. Enfin, la longue veille du tribun a pris fin."

