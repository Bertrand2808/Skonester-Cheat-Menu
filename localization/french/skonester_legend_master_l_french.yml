 skonester_legend_master.0902.t: "Vitesse de propagation des légendes"
 skonester_legend_master.spread_speed_desc: "Ajustez la rapidité avec laquelle les légendes de ce personnage se propagent aux provinces voisines. Sélectionnez à nouveau pour changer de palier."
 skonester_legend_master.0902.speed_normal: "🔄 Vitesse normale (retirer le bonus)"
 skonester_legend_master.0902.speed_fast: "⚡ Plus rapide (+50%)"
 skonester_legend_master.0902.speed_very_fast: "⚡⚡ Beaucoup plus rapide (+100%)"
 skonester_legend_master.0902.speed_instant: "💥 Propagation instantanée (+5000%)"

 skonester_legend_spread_speed_fast_modifier: "Propagation des légendes · Plus rapide"
 skonester_legend_spread_speed_fast_modifier_desc: "Les légendes se propagent 50% plus vite aux provinces adjacentes."
 skonester_legend_spread_speed_very_fast_modifier: "Propagation des légendes · Beaucoup plus rapide"
 skonester_legend_spread_speed_very_fast_modifier_desc: "Les légendes se propagent 100% plus vite aux provinces adjacentes."
 skonester_legend_spread_speed_instant_modifier: "Propagation des légendes · Instantanée"
 skonester_legend_spread_speed_instant_modifier_desc: "Les légendes se propagent 5000% plus vite aux provinces adjacentes."
 skonester_legend_master_spread_cheat_modifier: "Propagation légendaire · Bonus ultime"
 skonester_legend_master_spread_cheat_modifier_desc: "Augmente considérablement la vitesse de propagation des légendes. Compatible avec les anciennes versions du jeu."
 legend_spread_debug_modifier: "Propagation des légendes · Débogage"
 legend_spread_debug_modifier_desc: "Modificateur de débogage : propagation des légendes extrêmement rapide."
 skonester_legend_spread_barony_modifier: "Propagation des légendes · Baronnie"
 skonester_legend_spread_barony_modifier_desc: "Accorde des bonus à la croissance du développement, à l’opinion et à la taille de la levée dans cette baronnie."
 skonester_legend_spread_county_modifier: "Propagation des légendes · Comté"
 skonester_legend_spread_county_modifier_desc: "Accorde des bonus à la croissance du développement, à l’opinion et à la taille de la levée dans ce comté (effet hérité)."
