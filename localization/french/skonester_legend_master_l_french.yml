l_french:
 skonester_legend_master_panel_interaction: "Gestion des légendes"
 skonester_legend_master_panel_tip: "Ajoutez, renforcez ou retirez des légendes pour le personnage sélectionné (nécessite le DLC Legends of the Dead)."
 skonester_legend_master.0001.t: "Gestion des légendes"
 skonester_legend_master.0001.desc: "Cible actuelle : [skonester_cheat_menu_target.GetShortUIName]. Ajoutez des légendes de rang mythique à ce personnage. Ce menu est verrouillé sur la cible sélectionnée."
 skonester_legend_master.0002.desc: "Cible actuelle : [skonester_cheat_menu_target.GetShortUIName]. Ajustez la vitesse de propagation de ses légendes, ou #bold effacez toutes ses légendes#!, y compris celles déjà répandues sur la carte."
 skonester_legend_master.category_desc: "Ajoute à [skonester_cheat_menu_target.GetShortUIName] une légende de qualité mythique de la catégorie sélectionnée. Elle sera automatiquement définie comme légende promue."

