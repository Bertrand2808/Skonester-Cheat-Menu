 skonester_legend_master_clear_toast_title: "Légendes effacées"
 skonester_legend_master_clear_toast_desc: "Toutes les légendes, leur propagation régionale et les modificateurs de vitesse ont été retirés de [skonester_cheat_menu_target.GetShortUIName]."
