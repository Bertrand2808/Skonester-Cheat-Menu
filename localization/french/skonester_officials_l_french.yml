 skonester_cheat_menu_force_marriage_interaction_desc: "Ouvre le menu de mariage vanilla avec [actor.GetShortUIName|U] et [recipient.GetShortUIName|U] présélectionnés. Cette action annule les mariages et fiançailles existants, libère les prisonniers et change temporairement la foi pour contourner les restrictions de parenté, de religion, de culture, de distance, de rang, de lois sur le mariage et d’opinion. Vous pouvez sélectionner d’autres personnages dans la liste. La demande en mariage réussira toujours."
