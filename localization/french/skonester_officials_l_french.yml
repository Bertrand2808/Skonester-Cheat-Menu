 skonester_trait_immortal_ageless: "Immortel sans âge"
 skonester_trait_immortal_ageless_desc: "Le temps n’a pas de prise sur vous. Vous ne vieillissez pas, ne pouvez devenir infirme, résistez fortement aux maladies et êtes presque insensible aux meurtres et aux complots hostiles."
 skonester_trait_yannian_dan: "Élixir de longévité"
 skonester_trait_yannian_dan_desc: "Un puissant élixir qui préserve la jeunesse, prolonge la vie et repousse la maladie."
 skonester_trait_yannian_dan_mid: "Élixir de longévité raffiné"
 skonester_trait_yannian_dan_mid_desc: "Un élixir raffiné qui préserve la jeunesse, prolonge grandement la vie et repousse la maladie."
 skonester_trait_yannian_dan_best: "Élixir de longévité suprême"
 skonester_trait_yannian_dan_best_desc: "Un élixir sans égal qui défie le vieillissement des mortels, accorde une vie prolongée et une protection totale contre la maladie."
 skonester_trait_baidubuqin: "Immunité aux poisons"
 skonester_trait_baidubuqin_desc: "Immunisé contre les maladies et les épidémies. Toutes les maladies existantes sont guéries à l’obtention de ce trait."
 skonester_trait_xinwuguai: "Esprit apaisé"
 skonester_trait_xinwuguai_desc: "Votre esprit est libre de tout fardeau. Le stress reste à zéro et ne s’accumule presque jamais. Tout le stress actuel est supprimé à l’obtention."
 skonester_trait_marriage_ban: "Mariage restreint"
 skonester_trait_marriage_ban_desc: "Ne peut ni se marier ni être fiancé. Tous les mariages et fiançailles existants sont dissous. Activez à nouveau ce trait pour lever la restriction."
 skonester_trait_stats_100_locked: "Compétences au maximum (verrouillées)"
 skonester_trait_stats_100_locked_desc: "Toutes les compétences principales et la Prouesse sont verrouillées à 100. Aucun événement, vieillissement ni effet ne peut les modifier."

 trait_skonester_cheat_menu: "Trait spécial"
 trait_warlord_eternal: "Seigneur de guerre éternel"
 trait_warlord_eternal_desc: "Un maître de la guerre. Les troupes se battent avec plus d’ardeur, la vitesse de déplacement est fortement accrue, les pénalités de terrain sont annulées et les sièges prennent fin rapidement."
 trait_wealth_sovereign_max: "Souverain de la richesse"
 trait_wealth_sovereign_max_desc: "Maître du commerce et de la fiscalité. Le revenu, les contributions des vassaux et les réserves du trésor sont considérablement améliorés."
 trait_ultimate_intrigue_master: "Voyant mystique"
 trait_ultimate_intrigue_master_desc: "Sans égal dans les complots de l’ombre. Les complots ennemis contre vous échouent facilement, tandis que les vôtres restent secrets et presque certains de réussir."
 trait_great_builder_god: "Bâtisseur divin"
 trait_great_builder_god_desc: "Maîtrise suprême de la construction. Les bâtiments et propriétés du royaume sont construits pour un coût et un délai minimaux. Intendance, impôts, développement, fortifications et levées reçoivent tous d’énormes bonus."
 trait_nether_conspiracy_lord: "Seigneur de la conspiration des enfers"
 trait_nether_conspiracy_lord_desc: "Un grand maître de l’intrigue. Vos complots sont plus discrets et plus efficaces, tandis que ceux de vos ennemis sont ralentis et affaiblis. La Redoutabilité augmente et l’opinion de la cour penche en votre faveur."
 trait_eternal_nether_lord: "Seigneur éternel des enfers"
 trait_eternal_nether_lord_desc: "Une présence d’ombre immortelle. Le stress a peu d’effet, la Redoutabilité est immense, la puissance d’intrigue est accrue. Les complots hostiles réussissent rarement, et vassaux comme courtisans vous vénèrent avec crainte."
 trait_the_wake: "Rôdeur des marais"
 trait_the_wake_desc: "Le summum des pillards des marais. Puissant en terrain marécageux et habile au pillage, mais méprisé par les cultures normandes."
 trait_lifestyle_traveler: "Vagabond"
 trait_lifestyle_traveler_desc: "Un trait à paliers issu du mode de vie d’errance. Gagne en puissance grâce aux voyages, aux découvertes et aux périples à travers le royaume."
 trait_child_of_concubine_female: "Fille de concubine"
 trait_child_of_concubine_female_desc: "Née d’une épouse secondaire. Les lois de succession et de famille peuvent la traiter différemment des enfants légitimes."
 trait_child_of_concubine_male: "Fils de concubine"
 trait_child_of_concubine_male_desc: "Né d’une épouse secondaire. Les lois de succession et de famille peuvent le traiter différemment des enfants légitimes."
 trait_hajjaj: "Hajji"
 trait_shieldmaiden: "Porteuse de bouclier"
 trait_viking: "Pilleur viking"

