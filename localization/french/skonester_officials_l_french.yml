 trait_warlord_god: "Dieu des cent batailles"
 trait_warlord_god_desc: "#bold Trait de triche#! pour les commandants. Augmente fortement la [martial|e] et la #bold Prouesse#! ($game_concept_prowess$). Relève les limites de #bold chevaliers#! et l’efficacité sur le champ de bataille, renforce les dégâts, la résistance des #bold armées#! et la puissance de #bold siège#!. Accorde une #bold Redoutabilité#! de base plus élevée, accélère le renouvellement des #bold levées#! et réduit l’#bold entretien des armées#!. Les bonus de déplacement et de terrain sont accordés via les modificateurs de personnalité. #bold Non héréditaire#!. Exclu du concepteur de dirigeant et des listes de traits aléatoires. N’accorde pas de drapeau de combat invincible. Peut être appliqué par clic droit sur un personnage dans le menu principal Skonester, ou par commande : #bold add_trait = warlord_god#!. Ce trait se cumule séparément avec #bold Immortel céleste#!. Icône : #bold casque doré et épées croisées#! (thème [commander|e])."

