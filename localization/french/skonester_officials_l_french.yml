 skonester_tt_no_vassal_for_mass_gov_fail: "Aucun vassal éligible à la conversion. Le gouvernement cible est déjà actif, les candidats sont inéligibles, ou le rang de leur titre principal est inférieur au comté."
 skonester_tt_has_grantable_title_for_one_click_fail: "Aucun titre non attribué disponible."
 skonester_tt_has_grant_recipient_available_fail: "Aucun bénéficiaire adapté pour recevoir des titres."
 skonester_tt_has_dynasty_grant_recipient_available_fail: "Aucun membre adulte de la dynastie qualifié pour recevoir des titres selon les règles actuelles."
 skonester_tt_has_anyone_to_purge_fail: "Aucune cible éligible. Nécessite des gouverneurs incompétents ou des nobles possédant des terres et un titre principal de rang correspondant, qui ont aussi un héritier désigné : héritier principal, héritier du joueur ou tout héritier vivant (y compris les héritiers générés par l’administration provinciale)."
 skonester_tt_has_de_jure_transferable_direct_vassals_fail: "Aucun vassal ne peut être réattribué à son seigneur lige de jure."
 skonester_tt_no_imprisonable_direct_vassal_fail: "Aucun vassal direct ne peut être emprisonné. Tous sont déjà incarcérés ou exemptés d’arrestation scriptée."
 skonester_tt_no_imprisonable_realm_vassal_fail: "Aucun vassal du royaume ne peut être emprisonné. Tous sont déjà incarcérés ou exemptés d’arrestation scriptée."
 skonester_tt_no_official_for_land_cap_fail: "Aucun vassal éligible possédant des terres. Nécessite des vassaux détenant un titre de rang comté ou supérieur ; vos propres titres ne comptent pas."
 skonester_tt_no_tribal_holding_to_feudalize_fail: "Aucune colonie tribale, nomade ou pastorale de votre royaume ne peut être convertie en château."
 skonester_tt_no_merit_official_to_promote_fail: "Aucun vassal éligible. Les candidats doivent détenir des titres de terres ; les fonctionnaires méritocratiques ne doivent pas avoir atteint le rang maximal, tandis que les vassaux ordinaires possédant des terres sont toujours qualifiés."
 skonester_tt_no_official_gold_to_exploit_fail: "Aucun fonctionnaire éligible à la saisie de fonds. La limite de rang doit être supérieure à zéro et les cibles doivent posséder de l’or."

 skonester_official_land_cap_decision: "Consolider les titres"
 skonester_official_land_cap_decision_desc: "Force les vassaux de rang comté et supérieur à ne conserver que leur titre principal et un comté ; les titres excédentaires retirés sont attribués à d’autres dans le royaume — ils ne s’accumulent pas sur vous."
 skonester_official_land_cap_decision_tooltip: "Au moins un vassal du royaume détient encore des titres excédentaires."
 skonester_official_land_cap_decision_confirm: "Confirmer"
 skonester_official_land_cap_effect_tt: "Un clic réorganise tout le royaume : chaque vassal soumis aux plafonds de terres est traité immédiatement. Vous êtes averti à la fin."
 skonester_land_cap_batch_complete_toast_title: "Consolidation des titres terminée"
 skonester_land_cap_batch_complete_toast_desc: "L’application des plafonds de terres est terminée dans le royaume ; les titres excédentaires ont été attribués et ne se sont pas accumulés sur vous."

 skonester_one_click_strip_official_titles_decision: "Saisie des titres en un clic"
 skonester_one_click_strip_official_titles_decision_desc: "Un seul clic lance des révocations de titres répétées jusqu’à la fin : tous les comtés, duchés et titres de rang supérieur de votre royaume vous reviennent."
 skonester_one_click_strip_official_titles_decision_tooltip: "Révoque tous les titres de votre royaume et vous les accorde directement."
 skonester_one_click_strip_official_titles_decision_confirm: "Confirmer la saisie"
 skonester_one_click_strip_official_titles_effect_tt: "Effectue automatiquement des révocations de titres successives jusqu’à ce qu’il ne reste plus de comtés, de duchés ou de titres supérieurs à réclamer dans votre royaume. Les dirigeants étrangers indépendants ne sont pas affectés."

