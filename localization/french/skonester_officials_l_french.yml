 skonester_foreman_vassal_unified_interaction: "Contremaîtres intendants : domaine de la cible"
 skonester_foreman_vassal_unified_interaction_desc: ""

 skonester_world_ai_boost_pause_decision: "Suspendre les bonus globaux des royaumes IA"
 skonester_world_ai_boost_pause_decision_desc: ""
 skonester_world_ai_boost_pause_decision_tooltip: "Apparaît tant que le système de bonus est actif ; remplacé par l’option de reprise après désactivation."
 skonester_world_ai_boost_pause_decision_confirm: "Désactiver les bonus IA"
 skonester_world_ai_boost_pause_effect_tt: "Suspension globale active. Le menu des bonus IA reste masqué jusqu’à reprise manuelle."
 skonester_world_ai_boost_resume_decision: "Reprendre les bonus globaux des royaumes IA"
 skonester_world_ai_boost_resume_decision_desc: ""
 skonester_world_ai_boost_resume_decision_tooltip: "Visible uniquement lorsque tous les bonus IA sont suspendus."
 skonester_world_ai_boost_resume_decision_confirm: "Réactiver les bonus IA"
 skonester_world_ai_boost_resume_effect_tt: "Suspension levée ; les renforts globaux de l’IA sont de nouveau disponibles."

 skonester_boost_world_ai_rulers_decision: "Renforcer tous les royaumes IA indépendants"
 skonester_boost_world_ai_rulers_decision_desc: "Accorde de pleins bonus militaires, économiques et diplomatiques à tous les seigneurs IA possédant des terres afin d’alimenter l’expansion et la guerre. Si le joueur devient écrasant, les nations IA sont bien plus enclines à former des coalitions contre votre hégémonie, pour un jeu équilibré."
 skonester_boost_world_ai_rulers_decision_tooltip: "Bonus global non suspendu. #bold Aucun coût en prestige requis.#!"
 skonester_boost_world_ai_rulers_decision_confirm: "Activer le renforcement complet de l’IA"
 skonester_boost_world_ai_rulers_effect_tt: "Tous les #bold dirigeants IA possédant des terres#! reçoivent le modificateur Soutien à la gouvernance pendant #bold 15#! ans, obtenant des avantages annuels de construction et d’hommes d’armes pendant toute la durée."

 skonester_ai_yearly_admin_conversion_toggle_title_on: "#bold 【ACTIVÉ】#! Déclencheur annuel : réforme administrative automatique des gouvernements IA"
 skonester_ai_yearly_admin_conversion_toggle_title_off: "#bold 【DÉSACTIVÉ】#! Déclencheur annuel : réforme administrative automatique des gouvernements IA"
 skonester_ai_yearly_admin_conversion_toggle_desc_on: "Actuellement activé. Nécessite Roads to Power (EP3). Chaque année, toutes les IA indépendantes possédant des terres ainsi que leurs vassaux passent automatiquement en gouvernement administratif. Activé par défaut, indépendamment du renforcement manuel de l’IA. Les suzerains nomades, tribaux et des steppes ne convertissent plus leurs vassaux en masse afin d’éviter toute sécession involontaire. Même après la désactivation de cette option, les redevances vassaliques renforcées et les modificateurs d’expansion restent fonctionnels. Cliquez pour désactiver la conversion annuelle automatique de gouvernement."
 skonester_ai_yearly_admin_conversion_toggle_desc_off: "Actuellement désactivé. Le script annuel ne fait plus passer les royaumes IA en gouvernement administratif EP3. Les bonus d’obligations vassaliques et les avantages annuels d’expansion persistent ; le changement manuel de gouvernement reste accessible via le menu de politique. Cliquez pour réactiver la réforme annuelle automatique."
 skonester_ai_yearly_admin_conversion_toggle_tooltip_on: "Actif : conversion administrative annuelle des IA indépendantes (EP3 requis). Cliquez pour désactiver."
 skonester_ai_yearly_admin_conversion_toggle_tooltip_off: "Inactif : aucun changement de gouvernement annuel automatique pour l’IA. Cliquez pour activer."
 skonester_ai_yearly_admin_conversion_toggle_confirm_disable: "Désactiver l’auto-réforme administrative annuelle"
 skonester_ai_yearly_admin_conversion_toggle_confirm_enable: "Activer l’auto-réforme administrative annuelle"
 skonester_ai_yearly_admin_conversion_toggle_effect_disabled_tt: "Désactivé : la conversion annuelle automatique des IA en gouvernement administratif est interrompue."
 skonester_ai_yearly_admin_conversion_toggle_effect_enabled_tt: "Activé : les IA indépendantes qualifiées passent chaque année en gouvernement administratif (EP3 requis)."

 skonester_ai_yearly_pulse_toggle_title_on: "#bold 【ACTIVÉ】#! Impulsion globale annuelle (interrupteur principal)"
 skonester_ai_yearly_pulse_toggle_title_off: "#bold 【DÉSACTIVÉ】#! Impulsion globale annuelle (interrupteur principal)"
 skonester_ai_yearly_pulse_toggle_desc_on: "Activée par défaut. Toutes les IA indépendantes possédant des terres reçoivent tous les avantages de l’impulsion annuelle : modificateurs d’expansion et de guerre, fiscalité vassalique accrue, actualisation annuelle de la coalition anti-hégémonie. Sous-options : conversion administrative activée par défaut, réattribution des vassaux de jure désactivée par défaut. La première année de campagne ignore entièrement l’impulsion complète. Désactiver l’interrupteur principal masque toutes les sous-options et arrête les scripts concernés. N’interagit pas avec le système mensuel automatique de bonus IA. Cliquez pour désactiver tout le système d’impulsion annuelle."
 skonester_ai_yearly_pulse_toggle_desc_off: "Actuellement désactivée. L’événement 9200 ne se déclenche plus ; l’actualisation annuelle de la coalition anti-joueur propre au mod cesse (les vérifications trimestrielles et mensuelles ne sont pas affectées). Cliquez pour réactiver l’impulsion globale annuelle."
 skonester_ai_yearly_pulse_toggle_tooltip_on: "Active par défaut, impulsion annuelle complète opérationnelle ; cliquez pour couper l’interrupteur principal."
 skonester_ai_yearly_pulse_toggle_tooltip_off: "Toutes les mécaniques d’impulsion annuelle sont suspendues ; cliquez pour activer l’interrupteur principal."
 skonester_ai_yearly_pulse_toggle_confirm_disable: "Désactiver l’interrupteur principal de l’impulsion annuelle"
 skonester_ai_yearly_pulse_toggle_confirm_enable: "Activer l’interrupteur principal de l’impulsion annuelle"
 skonester_ai_yearly_pulse_toggle_effect_disabled_tt: "Désactivé : l’événement 9200 et l’actualisation annuelle de la coalition anti-hégémonie ne s’exécutent plus."
 skonester_ai_yearly_pulse_toggle_effect_enabled_tt: "Activé : l’impulsion annuelle s’exécute selon la configuration de chaque sous-option."

 skonester_ai_yearly_de_jure_transfer_toggle_title_on: "#bold 【ACTIVÉ】#! Impulsion annuelle : réattribution automatique des vassaux de jure de l’IA"
 skonester_ai_yearly_de_jure_transfer_toggle_title_off: "#bold 【DÉSACTIVÉ】#! Impulsion annuelle : réattribution automatique des vassaux de jure de l’IA"
 skonester_ai_yearly_de_jure_transfer_toggle_desc_on: "Actuellement activé. L’IA indépendante exécute automatiquement, une fois par an, la même restructuration de masse des vassaux de jure que celle disponible dans les décisions du joueur. Modifie la disposition vassalique de départ vanilla (Hexi, Gobi, etc.), désactivé par défaut. La désactivation laisse intacts les bonus d’expansion, les surtaxes et l’auto-réforme administrative ; les joueurs conservent la résolution manuelle des transferts de jure. Cliquez pour désactiver la réattribution de jure automatique de l’IA."
 skonester_ai_yearly_de_jure_transfer_toggle_desc_off: "Désactivé par défaut. L’impulsion annuelle ignore le réaménagement légal des vassaux de l’IA afin de préserver les frontières de départ vanilla d’origine. Toutes les campagnes nouvellement lancées ignorent entièrement l’impulsion annuelle de la première année. Cliquez pour activer le transfert de jure automatique des vassaux."
 skonester_ai_yearly_de_jure_transfer_toggle_tooltip_on: "Actif : l’IA indépendante réattribue chaque année selon le de jure ; cliquez pour désactiver."
 skonester_ai_yearly_de_jure_transfer_toggle_tooltip_off: "Inactif par défaut : aucun transfert légal automatique des vassaux ; cliquez pour activer."
 skonester_ai_yearly_de_jure_transfer_toggle_confirm_disable: "Désactiver la réattribution de jure automatique annuelle"
 skonester_ai_yearly_de_jure_transfer_toggle_confirm_enable: "Activer la réattribution de jure automatique annuelle"
 skonester_ai_yearly_de_jure_transfer_toggle_effect_disabled_tt: "Désactivé : l’impulsion annuelle n’exécute plus la restructuration automatique des vassaux de jure."
 skonester_ai_yearly_de_jure_transfer_toggle_effect_enabled_tt: "Activé : les royaumes IA indépendants subissent chaque année une réorganisation des vassaux de jure."

 skonester_ai_boost_toggle_decision_title_on: "#bold 【ACTIVÉ】#! Renforcement passif mensuel de l’IA"
 skonester_ai_boost_toggle_decision_title_off: "#bold 【DÉSACTIVÉ】#! Renforcement passif mensuel de l’IA"
 skonester_ai_boost_toggle_decision_desc_on: "Les bonus de statistiques mensuels automatiques de l’IA sont actifs. Jusqu’à 600 seigneurs IA possédant des terres reçoivent des bonus de royaume rayonnant depuis le domaine du joueur chaque mois calendaire, en plus du renforcement manuel de l’IA en un clic. Cliquez pour désactiver."
 skonester_ai_boost_toggle_decision_desc_off: "Le renforcement passif mensuel de l’IA est inactif. Cliquez pour activer cette fonction, puis de nouveau pour l’arrêter."
 skonester_ai_boost_toggle_decision_tooltip_on: "Renforcement automatique en cours, cliquez pour suspendre les bonus mensuels."
 skonester_ai_boost_toggle_decision_tooltip_off: "Renforcement automatique désactivé, cliquez pour lancer les bonus mensuels."
 skonester_ai_boost_toggle_decision_confirm_disable: "Suspendre les bonus mensuels automatiques de l’IA"
 skonester_ai_boost_toggle_decision_confirm_enable: "Activer les bonus mensuels automatiques de l’IA"
 skonester_ai_boost_toggle_effect_enabled_tt: "Renforcement mensuel de l’IA actif : jusqu’à 600 IA possédant des terres gagnent chaque mois des avantages nationaux rayonnants."
 skonester_ai_boost_toggle_effect_disabled_tt: "Renforcement mensuel de l’IA suspendu : plus aucun bonus passif de statistiques n’est appliqué automatiquement."

 skonester_ai_realm_governance_support: "Soutien à la gouvernance"
 skonester_ai_realm_governance_support_desc: "Réduction d’environ 50 % de l’entretien des armées ; plafond d’hommes d’armes et taille des unités considérablement accrus. Vitesse de construction et revenus du domaine améliorés, ainsi que la diplomatie et l’inclination belliqueuse. L’IA gagne en cupidité mais perd en compassion et en honneur ; limite du domaine +2. Tous les royaumes indépendants obtiennent des bonus d’expansion annuels, des modificateurs d’élan cumulables, des redevances vassaliques accrues et les avantages administratifs EP3. Réattribution automatique permanente des vassaux de jure activée."
 skonester_ai_expansion_push: "Élan d’expansion annuel"
 skonester_ai_expansion_push_desc: "Modificateur annuel du mod : construction ~60 % plus rapide, entretien des hommes d’armes ~70 % moins cher. Modifie le désir de guerre, la rationalité et l’ambition de l’IA pour qu’elle poursuive plus volontiers ses revendications sans forcer de déclarations de guerre arbitraires."
 skonester_ai_stable_surge: "Grand élan d’expansion annuel"
 skonester_ai_stable_surge_desc: "Hausse annuelle progressive de la belligérance, de l’audace, de la rationalité et de l’ambition de l’IA, s’ajoutant à l’élan d’expansion de base ; toutes les déclarations de guerre respectent la logique native non modifiée de l’IA du jeu de base."
 skonester_ai_counter_player_pressure: "Coalition anti-hégémonie"
 skonester_ai_counter_player_pressure_desc: "Se déclenche si le joueur possède un titre d’empire ou dirige plus de 80 comtés : toute l’IA indépendante gagne temporairement en portée diplomatique, sociabilité, intrigue et bellicisme afin d’encourager la formation d’alliances contre la domination écrasante du joueur. Les déclarations de guerre, enlèvements et mariages royaux suivent les règles de calcul vanilla non modifiées de l’IA."
 skonester_ai_counter_player_pressure_heavy: "Contrer la domination du joueur (renforcé)"
 skonester_ai_counter_player_pressure_heavy_desc: "Votre royaume a dépassé un seuil de taille critique : toute l’IA reçoit une diplomatie, une intrigue, une portée diplomatique et des poids de guerre/rancune accrus, rendant plus probables les alliances contre un joueur dominant. Les décisions de l’IA suivent toujours les règles du moteur de base."
