 skonester_officials.9083.t: "Purger les roturiers sans attache"
 skonester_officials.9083.desc: "Retire sans risque du réservoir de personnages les vagabonds IA inutilisés. La purge ne traite que 25 personnages tous les trois jours et ne cible jamais les courtisans, invités, dirigeants, aventuriers ni votre famille protégée. Une seule purge peut être active à la fois."
