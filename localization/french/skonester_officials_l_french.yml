 skonester_decision_open_learn_official_secrets: "Ouvrir l’Inquisition des robes de soie"
 skonester_decision_open_learn_official_secrets_desc: "Ouvre l’interaction #bold Inquisition des robes de soie#!. Un vassal possédant des terres sera présélectionné s’il détient des secrets que vous ignorez."
 skonester_decision_open_learn_official_secrets_tooltip: "Au moins un vassal possédant des terres cache des secrets que vous n’avez pas découverts."
 skonester_decision_open_learn_official_secrets_confirm: "Ouvrir"

 skonester_seduce_blocked_player_consort_tt: "Tant que la Veille des appartements privés est #bold activée#!, #bold tous les personnages, IA comprise,#! ne peuvent pas lancer de [scheme|E] de séduction contre vos conjoints et concubines. Des exceptions ne s’appliquent que si le conjoint ou son seigneur lige est l’instigateur ou la cible du complot. Chaque jour, tous les complots de romance, d’enlèvement et de fugue visant les membres du foyer sont arrêtés, et les liens amoureux entre membres du foyer et non-dirigeants sont rompus. Ce réglage est activé par défaut dans les nouvelles campagnes ; une fois désactivé manuellement, il ne se réactive plus automatiquement."
 skonester_seduce_blocked_harem_outgoing_tt: "Tant que la Veille des appartements privés est activée, vos conjoints et concubines #bold ne peuvent pas#! lancer de [scheme|E] de séduction contre d’autres (y compris l’#bold IA#!), sauf pour vous séduire. La veille met aussi fin chaque jour à tous les complots sortants de romance, d’enlèvement et de fugue lancés par vos partenaires."

 skonester_learn_all_realm_officials_secrets_decision: "Inquisition à l’échelle du royaume"
 skonester_learn_all_realm_officials_secrets_decision_desc: "Découvrez tous les secrets détenus par les fonctionnaires de votre royaume."
 skonester_learn_all_realm_officials_secrets_decision_tooltip: "Nécessite TGP et un gouvernement au cadre compatible."
 skonester_learn_all_realm_officials_secrets_decision_confirm: "Enquêter"
 skonester_learn_all_secrets_prestige_cost_desc: "Enquête à l’échelle du royaume"

 skonester_seduce_shield_for_consorts_decision_title_on: "#bold 【ACTIVÉ】#! Veille des appartements privés"
 skonester_seduce_shield_for_consorts_decision_title_off: "#bold 【DÉSACTIVÉ】#! Veille des appartements privés"
 skonester_seduce_shield_for_consorts_decision_desc_on: "La veille est active. Les étrangers ne peuvent pas séduire vos partenaires, et vos partenaires ne peuvent pas séduire d’autres personnes (IA comprise), sauf vous. Règles universelles : toute l’IA est privée de séduction, de cour et de fugue ; les liens d’amants extraconjugaux des IA mariées sont effacés chaque jour. Effets quotidiens : rafraîchit les traits Chaste et Loyal ; met fin à tous les complots de romance, d’enlèvement et de fugue entrants et sortants concernant votre foyer ; supprime les liens amoureux avec quiconque autre que vous. Un rafraîchissement annuel des traits sert de sauvegarde supplémentaire. Cliquez pour désactiver."
 skonester_seduce_shield_for_consorts_decision_desc_off: "La veille est inactive. Les nouvelles campagnes l’activent par défaut jusqu’à désactivation manuelle, après quoi elle reste désactivée. Lorsqu’elle est active, les partenaires sont protégés de la séduction, les restrictions de romance de l’IA s’appliquent globalement, les complots hostiles sont effacés chaque jour et les liens amoureux sans rapport sont supprimés. Les traits Chaste et Loyal sont rafraîchis chaque jour et chaque année."
 skonester_seduce_shield_for_consorts_decision_tooltip_on: "La veille est active. Cliquez pour la désactiver."
 skonester_seduce_shield_for_consorts_decision_tooltip_off: "La veille est inactive. Cliquez pour l’activer."
 skonester_seduce_shield_for_consorts_decision_confirm_disable: "Désactiver la veille"
 skonester_seduce_shield_for_consorts_decision_confirm_enable: "Activer la veille"

 skonester_bulk_guardian_run_decision: "Attribuer des tuteurs en masse"
 skonester_bulk_guardian_run_decision_desc: "Nomme des tuteurs qualifiés pour tous les enfants de votre royaume. Facultatif : lancez d’abord \"$skonester_court_management_decision$\" afin que des courtisans mieux qualifiés soient disponibles comme tuteurs."
 skonester_bulk_guardian_run_decision_tooltip: "Au moins un pupille est éligible. Réservé aux joueurs humains."
 skonester_bulk_guardian_run_decision_confirm: "Exécuter"
 skonester_bulk_guardian_strip_old_guardians_tt: "Supprime les anciens liens de tutelle de cet enfant, y compris les doublons et les entrées invalides."
 skonester_bulk_guardian_strip_tutor_other_wards_tt: "Met fin aux fonctions de tutelle de ce précepteur envers tous les autres pupilles existants."

 skonester_court_management_decision: "Purge et recrutement de la cour"
 skonester_court_management_decision_desc: "Renvoyez les courtisans inutiles (hors membres de la dynastie) et recrutez de nouveaux courtisans aux compétences supérieures."
 skonester_court_management_decision_tooltip: "Réservé aux joueurs humains. Effectue un seul cycle de purge et de recrutement."
 skonester_court_management_decision_confirm: "Exécuter"
 skonester_court_mgmt_msg_title: "Cour réorganisée"
 skonester_court_mgmt_msg_desc: ""

 skonester_adopted_son_interaction: "Adopter dans la dynastie et la maison"
 skonester_adopted_son_interaction_desc: "Fonction de triche : fait de ce personnage votre enfant (père si vous êtes un homme, mère si vous êtes une femme) et l’intègre à votre maison. Retire tous les traits de bâtard. Vous devez appartenir à une maison noble. Ne peut pas cibler votre conjoint, vos enfants existants ni vos parents. Si la cible est plus âgée que vous ou du même âge, son âge sera temporairement ajusté pour établir le lien parent-enfant, puis restauré."
 skonester_cheat_menu_same_house_interaction: "Unir sous votre maison"
 skonester_cheat_menu_same_house_interaction_desc: "Fait entrer ce personnage dans votre dynastie et votre maison noble, avec votre nom de famille. Ne modifie pas la filiation. Vous devez diriger une dynastie et une maison. Masqué automatiquement s’il appartient déjà à votre maison."

 skonester_officials.9071.t: "Fixer le plafond de revenus par rang"
 skonester_officials.9071.desc: ""

 skonester_foreman_realm_unified_decision: "Contremaîtres intendants : tout le royaume"
 skonester_foreman_realm_unified_decision_desc: "Construit intelligemment et porte au maximum les bâtiments principaux et les emplacements de chaque comté de votre royaume selon le type de propriété (même résultat que l’ancienne version en une seule image). Pour éviter les ralentissements dans les grands royaumes, la construction s’exécute par lots quotidiens (~10 comtés par lot, un lot par jour en jeu) ; cette décision ne peut être reprise avant la fin — plus le royaume est grand, plus il faut de jours en jeu."
 skonester_foreman_realm_unified_decision_req_idle: "Aucun lot de construction à l’échelle du royaume n’est en cours"
