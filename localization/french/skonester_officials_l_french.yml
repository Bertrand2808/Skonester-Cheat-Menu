 skonester_cheat_menu_court_cabinet_interaction: "Cabinet de la cour"
 skonester_cheat_menu_court_cabinet_interaction_desc: "Nomme automatiquement tous les postes du cabinet selon la compétence des personnages"

 skonester_cheat_menu_character_gen_hub_interaction: "Créer des personnages"
 skonester_cheat_menu_character_gen_hub_interaction_desc: "Ouvre un sous-menu : créez des courtisans, des compagnons ou des enfants pour le personnage sur lequel vous avez fait un clic droit."
 skonester_cheat_menu.3088.t: "Créer des personnages"
 skonester_cheat_menu.3088.desc: "Sélectionnez une option de création pour le personnage sur lequel vous avez fait un clic droit."
 skonester_cheat_menu_spawn_talent_interaction: "Créer un courtisan"
 skonester_cheat_menu_spawn_talent_interaction_desc: "Recrutez de nouveaux courtisans très talentueux"
 skonester_cheat_menu_birth_cheat_menu_interaction: "Générer des enfants"
 skonester_cheat_menu_birth_cheat_menu_interaction_desc: "Créez des enfants surdoués pour vous-même ou pour un autre personnage"
 skonester_cheat_menu_sand_soldiers_interaction: "Générateur d’unités"
 skonester_cheat_menu_sand_soldiers_interaction_desc: "Interface de création d’armées : parcourez les hommes d’armes par classe d’unité. Clic gauche pour créer des unités pour la cible sélectionnée."
 skonester_cheat_menu_beauty_companion_interaction: "Compagnons charmants"
 skonester_cheat_menu_beauty_companion_interaction_desc: "Génère un conjoint ou un compagnon exceptionnellement charismatique"

 skonester_cheat_menu_dissolve_domestic_factions_interaction: "Dissoudre les factions"
 skonester_cheat_menu_dissolve_domestic_factions_interaction_desc: "Dissout toutes les factions ciblant le personnage sélectionné. Les guerres de faction en cours se terminent par une paix blanche. Tous les vassaux et courtisans quittent les factions non belligérantes restantes."
 skonester_cheat_menu_strong_deterrence_interaction: "Dissuader la rébellion"
 skonester_cheat_menu_strong_deterrence_interaction_desc: "Effet réutilisable de 5 ans. Les cibles ne peuvent ni rejoindre de factions ni vous déclarer la guerre pendant 5 ans. S’applique à un seul vassal ou à tous les vassaux."
 skonester_strong_deterrence_target: "Ce vassal uniquement"
 skonester_strong_deterrence_all_vassals: "Tous les vassaux"
 skonester_strong_deterrence_must_be_vassal_tt: "La cible doit être un vassal ou un arrière-vassal vivant sous votre autorité."
 skonester_strong_deterrence_need_vassals_tt: "Vous devez avoir au moins un vassal vivant."
 skonester_strong_deterrence_toast_target_t: "Rébellion dissuadée"
 skonester_strong_deterrence_toast_target_desc: "[recipient.GetShortUIName] est dissuadé pendant 5 ans : il ne peut ni former de factions ni vous faire la guerre."
 skonester_strong_deterrence_toast_all_t: "Tous les vassaux dissuadés"
 skonester_strong_deterrence_toast_all_desc: "Tous vos vassaux sont dissuadés pendant 5 ans : ils ne peuvent ni former de factions ni vous faire la guerre."

 skonester_cheat_menu_loyal_vassals_interaction: "Rendre les vassaux loyaux"
 skonester_cheat_menu_loyal_vassals_interaction_desc: "Usage personnel uniquement : tous les vassaux directs gagnent +999 d’opinion envers vous et le trait Loyal."
 skonester_cheat_menu_loyal_vassals_must_be_ruler_tt: "Vous devez être un dirigeant possédant des terres pour utiliser cette option."
 skonester_loyal_vassals_toast_title: "Vassaux rendus loyaux"
 skonester_loyal_vassals_toast_desc: "Tous les vassaux ont reçu +999 d’opinion et le trait Loyal."
 skonester_cheat_menu_world_deterrence_interaction: "Dissuasion universelle"
 skonester_cheat_menu_world_deterrence_interaction_desc: "Verrouille votre Redoutabilité à 100 de façon permanente. Tous les vassaux directs sont intimidés, ne peuvent pas rejoindre de factions contre vous, et leur opinion de vous ne change plus."
 skonester_cheat_menu_world_deterrence_must_be_ruler_tt: "Vous devez être un dirigeant possédant des terres pour utiliser cette option."
 skonester_world_deterrence_toast_title: "Dissuasion universelle"
 skonester_world_deterrence_toast_desc: "Redoutabilité verrouillée à 100. Tous les vassaux directs vous craignent, ne peuvent pas déclencher de rébellions de faction, et leur opinion de vous est figée."
 skonester_world_deterrence_fear_opinion: "Craint votre puissance"
 skonester_world_deterrence_aura: "Dissuasion universelle"
 skonester_world_deterrence_aura_desc: "La Redoutabilité est verrouillée à 100 ; son déclin est arrêté et elle ne peut plus évoluer naturellement."

 skonester_cheat_menu_force_divorce_interaction: "Forcer le divorce"
 skonester_cheat_menu_force_divorce_interaction_desc: "Dissout immédiatement le mariage de la cible"
 skonester_cheat_menu_sterilize_interaction: "Stériliser"
 skonester_cheat_menu_sterilize_interaction_desc: "Stérilise définitivement le personnage ciblé"
 skonester_cheat_menu_age_edit_menu_interaction: "Modifier l’âge"
 skonester_cheat_menu_age_edit_menu_interaction_desc: "Ajustez l’âge du personnage ciblé"
 skonester_cheat_menu_edit_resources_menu_interaction: "Modifier les ressources"
 skonester_cheat_menu_edit_resources_menu_interaction_desc: "Modifiez l’or, le prestige, la piété, la limite de vassaux et d’autres ressources. Chaque icône correspond à un type de ressource."

 skonester_cheat_menu_set_realm_authority_interaction: "Autorité du royaume"
 skonester_cheat_menu_set_realm_authority_interaction_desc: "Définissez les niveaux d’autorité I à IV, verrouillez l’autorité absolue ou effacez l’état de repli."
 skonester_realm_auth_lock: "Verrouiller l’autorité absolue"
 skonester_realm_auth_lock_desc: "Fixe définitivement l’autorité au niveau maximal avec maintenance automatique (persiste au fil des mois, des années, des rechargements et des successions)."
 skonester_realm_auth_clear: "Effacer le verrouillage d’autorité"
 skonester_realm_auth_clear_desc: "Supprime les effets du verrouillage et les modificateurs de sauvegarde. Réinitialise les délais et les variables de repli, et désactive la maintenance automatique."
 skonester_realm_authority_locked_holder: "Autorité verrouillée"
 skonester_realm_auth_must_be_independent_tt: "Seuls les dirigeants indépendants peuvent modifier l’autorité du royaume. Les vassaux ne peuvent pas dépasser le niveau d’autorité de leur seigneur lige."
 skonester_realm_auth_lv1: "Niveau I : autorité limitée"
 skonester_realm_auth_lv2: "Niveau II : autorité modérée"
 skonester_realm_auth_lv3: "Niveau III : autorité élevée"
 skonester_realm_auth_lv4: "Niveau IV : autorité absolue"

 skonester_cheat_menu_county_cheat_menu_interaction: "Gestion des comtés"
 skonester_cheat_menu_county_cheat_menu_interaction_desc: "Modifiez les comtés du dirigeant sur lequel vous avez fait un clic droit : son domaine personnel ou les terres de ses vassaux (la cible doit être un personnage jouable possédant des terres)."
 skonester_cheat_menu_artifact_edit_menu_interaction: "Éditeur d’artefacts"
 skonester_cheat_menu_artifact_edit_menu_interaction_desc: "Fabriquez de nouveaux artefacts, modifiez ceux qui existent, volez des artefacts ou restaurez entièrement leur durabilité."
