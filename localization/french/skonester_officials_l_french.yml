 skonester_cheat_menu_force_pregnancy_interaction: "Forcer la grossesse"
 skonester_cheat_menu_force_pregnancy_interaction_desc: "Ciblez n’importe quelle femme vivante autre que vous-même. Si elle n’est ni votre conjointe, ni votre amante, ni votre âme sœur, ni votre concubine, elle tombera enceinte de vous en tant que père biologique. Cette grossesse sera traitée comme celle d’un bâtard inconnu, son conjoint actuel étant indiqué comme père présumé s’il existe, ce qui réduit le risque de révélation d’adultère. Si elle est votre conjointe, votre amante, votre âme sœur ou votre concubine, vous serez indiqué comme père biologique et présumé. Cette action ignore les restrictions de fertilité et ne crée ni relation amoureuse ni secret d’adultère. Les mineures et les personnages incapables de tomber enceintes ne sont pas affectés."
 skonester_cheat_menu_pregnancy_manage_interaction: "Gestion de la grossesse"
 skonester_cheat_menu_pregnancy_manage_interaction_desc: "Ajustez l’état de grossesse du personnage ciblé."
 skonester_cheat_menu_relation_confirm_interaction: "Vérifier un lien de parenté"
 skonester_cheat_menu_relation_confirm_interaction_desc: "Confirmez les liens familiaux existants entre des personnages."
 skonester_cheat_menu_add_concubine_interaction: "Prendre une concubine"
 skonester_cheat_menu_add_concubine_interaction_desc: "Nommez la cible comme votre concubine."
 skonester_cheat_menu_join_court_interaction: "Recruter à la cour"
 skonester_cheat_menu_join_court_interaction_desc: "Force un personnage sans terres à rejoindre votre cour."
 skonester_cheat_menu_make_my_vassal_interaction: "Faire un vassal direct"
 skonester_cheat_menu_make_my_vassal_interaction_desc: "Force la cible à vous prêter allégeance et à devenir votre vassal direct. Fonctionne pour tous les dirigeants possédant des terres, IA comme joueur. Sans effet s’ils sont déjà votre vassal direct. Vous et la cible devez posséder des terres. Le rang de leur titre principal ne peut pas dépasser le vôtre, et ils ne peuvent pas être votre seigneur lige ni se trouver au-dessus de vous dans la chaîne vassalique. Certains types de gouvernement, le statut de tributaire et d’autres règles du jeu peuvent tout de même bloquer cette action."
 skonester_cheat_menu_declare_war_interaction: "Déclarer la guerre"
 skonester_cheat_menu_declare_war_interaction_desc: "Lancez une guerre contre un dirigeant indépendant. Choisissez de le forcer au statut de tributaire ou de conquérir tout son royaume. Les trêves existantes sont levées au préalable, et aucune nouvelle trêve ne sera créée après la guerre."
 skonester_cheat_menu_war_cb_tributary: "Forcer le tribut"
 skonester_cheat_menu_war_cb_conquer_realm: "Conquérir tout le royaume"
