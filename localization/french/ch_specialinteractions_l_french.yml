 ch_convert_holding_to_castle_decision:0 "Convertir la propriété en château"
 ch_convert_holding_to_castle_decision_tooltip:0 "La ou les propriétés existantes seront remplacées par une propriété de type [castle|E]"
 ch_convert_holding_to_castle_decision_desc:0 "#F Des architectes et des ingénieurs affluent dans mon royaume depuis quelque temps. Beaucoup sont recherchés comme maîtres bâtisseurs, mais pour prouver leur talent, ils veulent de grands projets sur lesquels travailler.#!"
 ch_convert_holding_to_castle_decision_confirm:0 "Convertir la propriété en château"
 I_HAVE_CH_ELIGBLE_BARONIES_TO_CASTLE_COUNTY:1 "Vous avez une [barony|E] avec une [holding|E] pouvant être convertie en [castle|E]\n$EFFECT_LIST_BULLET$Seules les propriétés des [counties|E] dont vous êtes personnellement le [holder|E] sont éligibles\n$EFFECT_LIST_BULLET$Les propriétés avec des constructions en cours ne sont #bold pas#! éligibles\n$EFFECT_LIST_BULLET$Malgré ce que la fenêtre de sélection de propriété peut indiquer, vous #bold pouvez#! bel et bien sélectionner une [county_capital|E]\n$EFFECT_LIST_BULLET$Si vous convertissez un [temple|E], vous devrez peut-être attendre que votre [realm_priest|E] abandonne automatiquement la [holding|E]"

