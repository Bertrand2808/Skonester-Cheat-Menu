 ch_convert_holding_to_nomad_tt:0 "Convertit la propriété principale d’une baronnie." 
 ch_convert_holding_to_nomad_desc:0 "#F Les besoins du peuple ont changé, ce qui impose de modifier la fonction principale de cet établissement. Une nouvelle méthode de construction misera sur la mobilité et la puissance militaire.#!"
 ch_convert_holding_to_nomad_decision_confirm:0 "Convertir la propriété en camp nomade"
