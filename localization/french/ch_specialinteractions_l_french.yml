### CONVERT TO TEMPLE CITADEL
 ch_convert_holding_to_temple_citadel_decision:0 "Convertir la propriété en citadelle-temple"
 ch_convert_holding_to_temple_citadel_tooltip:0 "La ou les propriétés existantes seront remplacées par une citadelle de type [temple|E]"
 ch_convert_holding_to_temple_citadel_title:0 "Convertir la propriété en citadelle-temple"
 ch_convert_holding_to_temple_citadel_tt:0 "Convertit la propriété principale d’une baronnie." 
 ch_convert_holding_to_temple_citadel_desc:0 "#F Une grande entreprise spirituelle est nécessaire pour affermir la foi dans cette région. Nous devons consacrer cette terre au divin en bâtissant un lieu à la fois sacré et imprenable.#!"
 ch_convert_holding_to_temple_citadel_decision_confirm:0 "Convertir la propriété en citadelle-temple"
 ch_convert_holding_to_temple_citadel_decision_effect_message:0 "La propriété a été convertie en citadelle-temple."
 has_ch_eligble_barony_to_temple_citadel_in_county:1 "Vous avez une [barony|E] avec une [holding|E] pouvant être convertie en une citadelle de [temple|E]\n$EFFECT_LIST_BULLET$Seules les propriétés des [counties|E] dont vous êtes personnellement le [holder|E] sont éligibles\n$EFFECT_LIST_BULLET$Les propriétés avec des constructions en cours ne sont #bold pas#! éligibles\n$EFFECT_LIST_BULLET$Malgré ce que la fenêtre de sélection de propriété peut indiquer, vous #bold pouvez#! bel et bien sélectionner une [county_capital|E]"
 
 ### --- X Decisions ---
 X1_decision_title:0 "Embrasser la voie de la vaillance"
 X1_decision_desc:0 "La voix de l’honneur et de la chevalerie m’appelle. Par ce choix, mon nom sera chanté comme celui d’un chevalier loyal."
 X1_decision_confirm:0 "Que ma vaillance soit prouvée."

 X_build_title:0 "Entreprendre de grands travaux"
 X_build_desc:0 "Les champs sont en jachère et le peuple réclame pain et abri. Par ces labeurs de pierre et de bois, mon royaume sera renforcé."
 X_build_confirm:0 "Convoquez maçons et intendants."

 X_city_title:0 "Fonder un bourg"
 X_city_desc:0 "Là où s’étendent friches et hameaux, je ferai surgir un bourg de commerce et d’artisanat. Les marchands y afflueront et les guildes y prospéreront sous ma bannière."
 X_city_confirm:0 "Que le bourg soit érigé."

 X_temple_title:0 "Ériger une maison sacrée"
 X_temple_desc:0 "Les fidèles aspirent à un lieu de culte où cloches et prières pourront monter vers le ciel. Par mon ordre, un temple s’élèvera."
 X_temple_confirm:0 "Consacrez le sol."

 X_castle_title:0 "Fortifier par un château"
 X_castle_desc:0 "Rien ne garantit plus vite l’autorité d’un seigneur que des murs de pierre. Un donjon s’élèvera, bastion de puissance et siège de ma maison."
 X_castle_confirm:0 "Érigez la forteresse."

 X_unify_title:0 "Unir le royaume dans la foi et les coutumes"
 X_unify_desc:0 "Mes vassaux sont divers par la langue et le credo, divisés par les coutumes et la prière. Pourtant, sous une seule bannière, le sang et l’esprit seront réunis."
 X_unify_confirm:0 "Amenez le royaume à une seule foi et à une seule coutume."
