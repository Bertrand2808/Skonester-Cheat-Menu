 has_ch_eligble_barony_to_nomad_in_county:1 "Vous avez une [barony|E] avec une [holding|E] pouvant être convertie en un établissement nomade\n$EFFECT_LIST_BULLET$Seules les propriétés des [counties|E] dont vous êtes personnellement le [holder|E] sont éligibles\n$EFFECT_LIST_BULLET$Les propriétés avec des constructions en cours ne sont #bold pas#! éligibles\n$EFFECT_LIST_BULLET$Malgré ce que la fenêtre de sélection de propriété peut indiquer, vous #bold pouvez#! bel et bien sélectionner une [county_capital|E]"

