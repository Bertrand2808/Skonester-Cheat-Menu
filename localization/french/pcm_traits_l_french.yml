l_french:
 #Skonester Edition 
 trait_immortality:0 "Immortel"
 trait_immortality_desc:0 "Ce personnage a pris part au Don sacré de l’immortalité. Son visage restera éternellement jeune et il est à l’abri de l’étreinte de la mort naturelle."
 trait_immortality_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] a été béni du Don sacré de l’immortalité. [ROOT.GetCharacter.GetSheHe|U] ne vieillira jamais au-delà de vingt-cinq ans et ne cédera jamais à la mort naturelle."

 trait_super:0 "Parangon"
 trait_super_desc:0 "Ce personnage est un parangon parmi les mortels, doté d’attributs, d’une vigueur, d’un charme et de compétences inégalés qui placent au-dessus de tous les autres un être tel que [ROOT.GetCharacter.GetHerHim]."
 trait_super_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] a été exalté en parangon, doté d’une force, d’un esprit et d’une renommée sans limites."

 trait_super_governor:0 "Intendant des merveilles"
 trait_super_governor_desc:0 "Ce personnage gouverne avec une sagesse quasi divine. Ses terres prospèrent, ses villes fleurissent et l’ordre règne en maître, comme touché par la main du ciel."
 trait_super_governor_character_desc:0 "Sous le règne de [ROOT.GetCharacter.GetFirstNameNoTooltip], le royaume prospère, les champs fleurissent et même le plus humble paysan bénit le nom de son intendant."

 trait_super_general:0 "Chef de guerre oint"
 trait_super_general_desc:0 "Ce personnage mène les armées comme guidé par la main du destin elle-même. Ses troupes combattent avec une vaillance inébranlable et enchaînent les victoires."
 trait_super_general_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] commande avec un génie sans égal, craint de ses ennemis et vénéré de ses soldats, menant chaque armée au triomphe."

