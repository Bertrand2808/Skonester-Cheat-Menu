 sarc_char_design.1001.t:1 "Invite du concepteur de personnage"
 sarc_char_design.1001.desc.5:0 "Voulez-vous concevoir un dirigeant personnalisé? (ATTENTION: votre dynastie proche est éliminée ou déshéritée, et votre dirigeant actuel meurt une fois la création terminée.) (Après avoir choisi l’âge de votre personnage, celui-ci est créé avec 5 dans toutes les aptitudes. Ce personnage est désigné comme le fils de votre dirigeant actuel.)"
 sarc_char_design.1001.desc.10:0 "Voulez-vous concevoir un dirigeant personnalisé? (ATTENTION: votre dynastie proche est éliminée ou déshéritée, et votre dirigeant actuel meurt une fois la création terminée.) (Après avoir choisi l’âge de votre personnage, celui-ci est créé avec 10 dans toutes les aptitudes. Ce personnage est désigné comme le fils de votre dirigeant actuel.)"
 
 sarc_char_design.1002.t:1 "Tranche d’âge"
 sarc_char_design.1002.desc:0 "Choisissez la tranche d’âge de votre personnage personnalisé. Vous ne pouvez choisir que des âges inférieurs à celui du dirigeant actuel."
 
 sarc_char_design.age.event.t:1 "Âge"
 sarc_char_design.age.event.d:0 "Choisissez l’âge de votre personnage personnalisé."
 
 sarc_char_design.skill.event.t:1 "Aptitudes"
 sarc_char_design.skill.event.d.5:0 "Choisissez une aptitude pour modifier sa valeur. Toutes les aptitudes du personnage personnalisé ont démarré à 5. Les changements d’aptitudes n’apparaissent qu’après un jour, mais vous pouvez survoler la valeur dans l’écran du personnage pour obtenir le montant exact."
 sarc_char_design.skill.event.d.10:0 "Choisissez une aptitude pour modifier sa valeur. Toutes les aptitudes du personnage personnalisé ont démarré à 10. Les changements d’aptitudes n’apparaissent qu’après un jour, mais vous pouvez survoler la valeur dans l’écran du personnage pour obtenir le montant exact."
 
