 sarc_char_design.dyn.choice.event.t:1 "Choix pour la dynastie"
 sarc_char_design.dyn.choice.event.d:0 " Choisissez entre éliminer les membres de votre dynastie ou simplement ajouter le trait Déshérité à certains d’entre eux.\n\n Ces options garantissent que votre personnage hérite des titres du dirigeant.\n\n Les éliminer donne l’impression de repartir d’une dynastie presque vide, tandis que déshériter certains membres laisse la dynastie en grande partie intacte.\n\n Je conseille l’option de déshéritage en multijoueur, de peur que l’élimination de la dynastie ne touche d’autres joueurs."

