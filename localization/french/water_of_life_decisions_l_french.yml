l_french:

 start_searching_for_water_of_life_decision:0 "Un jour sans mort"
 start_searching_for_water_of_life_decision_tooltip:1 "Clavius a trouvé la paix qu’il cherchait non pas à Rome, mais dans le #E Nous#! de Marie. Il met leur lignée à l’abri pour toujours."
 
 start_searching_for_water_of_life_decision_desc:0 "#F 'J’ai vu deux choses inconciliables : un homme mort sans conteste, et ce même homme de nouveau vivant.'#!\n\nLorsque le tribun Clavius Aquila a fui la folie de Rome, il a suivi celle que les autres rejetaient. Comme le relate l’*Évangile de Marie*, Pierre la défia : 'A-t-Il vraiment parlé à une femme à notre insu ?' Mais Lévi répondit : 'Si le Sauveur l’a rendue digne, qui êtes-vous donc pour la rejeter ?'\n\nClavius devint l’épée de cette dignité. Pour protéger Marie — déguisée par des cheveux teints en rouge comme l’argile romaine — et leurs enfants secrets, il but à la Coupe. Il devint l’ancre contre la dissolution de la matière, gardant la vérité qu’elle enseignait : #'Le Fils de l’Homme est en vous. Suivez-Le !'#!\n\n#P Le tribun n’est jamais mort. Il parcourt encore la terre, sentinelle éternelle de la Gnose.#!\n\n#X #bold ~ TRIBUN DE LA DIXIÈME, GARDIEN DU SILENCE ~ \n   ~ 'IL L’AIMAIT PLUS QUE NOUS' ~ \n~ BARBARA, LA RENAISSANTE, SE LÈVERA ~ #! #!"
 
 start_searching_for_water_of_life_decision_start:0 "#Y #bold *'La paix soit avec vous. Acquérez ma paix en vous-mêmes.'#!"
 
 start_searching_for_water_of_life_decision_proceed:0 "Le sceau du tombeau fut brisé, et l’emprise de la mort aussi. Clavius perdure dans l’ombre, attendant le descendant qui porte le #E Nous#! (l’Esprit) de sa bien-aimée Marie. Acceptez de rejoindre la #P Lignée de Barbara#! — la Magdaléenne renaissante. Obtenez #Z La protection du tribun#! et une #E revendication du Graal#!, mais méfiez-vous de la jalousie des orthodoxes."
 
 start_searching_for_water_of_life_decision_stress:0 "Marie enseignait : 'Car là où est l’esprit, là est le trésor.' Pourtant Clavius s’est attardé dans la chair pendant des siècles, tandis qu’elle s’élevait pour reposer dans le Silence. Pourrai-je supporter cette séparation ?"
 
 start_searching_for_water_of_life_decision_stress_lazy:0 "#N 'Prenez garde que personne ne vous égare.' Un Gardien ne peut dormir. Avec [GetTrait('lazy').GetName( GetPlayer )], la discipline nécessaire pour chercher le #E Fils de l’Homme en soi#! tombe en poussière.#!"
 
 start_searching_for_water_of_life_decision_confirm:0 "Toutes les natures se résolvent en leurs racines."
 
 water_of_life_modifier_knight_and_maa_limit_and_cap_increased:0 "Gardiens du Nous"
 water_of_life_modifier_hunting_trophy:0 "L’Évangile secret"
 water_of_life_modifier_good_deal:0 "Commerce avec le village caché"
 water_of_life_modifier_hunting_trophy_desc:0 "Un fragment retrouvé de l’Évangile secret témoigne du voyage et de la retenue de ce dirigeant dans le désert."
 water_of_life_modifier_good_deal_desc:0 "Des marchands du village caché du tribun apportent un flux régulier d’échanges commerciaux aux terres de ce dirigeant."
 water_of_life_modifier_knight_and_maa_limit_and_cap_increased_desc:0 "Les maisonnées qui ont approvisionné la longue veille du tribun engagent désormais leurs soldats auprès de son successeur."

